name: mf-clientes

services:
  mf-clientes:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    image: mf/mf-clientes:latest
    container_name: mf-clientes
    ports:
      - "5001:80"
    networks: [mf-net]
    restart: unless-stopped

networks:
  mf-net:
    name: mf-net
