name: back-clientes

services:
  db-clientes:
    image: postgres:17-alpine
    container_name: db-clientes
    environment:
      POSTGRES_USER: clientes
      POSTGRES_PASSWORD: clientes
      POSTGRES_DB: clientes
    ports:
      - "5432:5432"
    volumes:
      - db-clientes-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientes -d clientes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mf-net]
    restart: unless-stopped

  back-clientes:
    build:
      context: .
    image: mf/back-clientes:latest
    container_name: back-clientes
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://clientes:clientes@db-clientes:5432/clientes
      CORS_ORIGINS: http://localhost:5000,http://localhost:5001,http://localhost:5002
    ports:
      - "3001:3001"
    depends_on:
      db-clientes:
        condition: service_healthy
    networks: [mf-net]
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: db-clientes
    ports:
      - "8080:8080"
    depends_on:
      - db-clientes
    networks: [mf-net]
    restart: unless-stopped

volumes:
  db-clientes-data:
    name: mf-db-clientes-data

networks:
  mf-net:
    name: mf-net
